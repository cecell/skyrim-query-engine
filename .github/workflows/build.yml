# Builds skqe.exe and runs the unit tests (valid and damaged plugins, strings
# files, zlib streams) on a clean runner, with the same MSVC toolset as local
# builds. The decoder's reference checks need the Bethesda corpus and run
# locally (tools/verify_tables.py).

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      MSVC_TOOLSET: "14.44"
    steps:
      - uses: actions/checkout@v5

      - name: Build and test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=%MSVC_TOOLSET% || exit /b 1
          cl 2>&1 | findstr /C:"Version"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build || exit /b 1
          ctest --test-dir build --output-on-failure || exit /b 1
          build\skqe.exe --help > nul || exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: skqe
          path: |
            build/skqe.exe
            build/patterns.json

  # libFuzzer + AddressSanitizer for 5 minutes on GitHub's runner (local
  # antivirus holds instrumented executables). Seeds are the unit tests'
  # hand-built inputs; a crash or out-of-bounds access fails the job and
  # uploads the input that caused it.
  fuzz:
    runs-on: windows-2025
    env:
      MSVC_TOOLSET: "14.44"
    steps:
      - uses: actions/checkout@v5

      - name: Build and fuzz
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=%MSVC_TOOLSET% || exit /b 1
          rem Seeds come from a normal build of the unit tests.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build --target skqe_tests || exit /b 1
          mkdir build-fuzz\corpus
          build\skqe_tests.exe --seeds build-fuzz\corpus || exit /b 1
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKQE_FUZZ=ON || exit /b 1
          cmake --build build-fuzz --target skqe_fuzz || exit /b 1
          mkdir build-fuzz\crashes
          build-fuzz\skqe_fuzz.exe build-fuzz\corpus -max_total_time=300 -timeout=10 -rss_limit_mb=2048 -max_len=262144 -artifact_prefix=build-fuzz\crashes\ -print_final_stats=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: build-fuzz/crashes/
